[project]
name = "call_me_maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic",
    "numpy",
    "accelerate"
]

[tool.uv.workspace]
members = [
    "src/llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
exclude = [
    '^\\.venv/',
    '^src/llm_sdk/',
    '^moulinette/',
]
