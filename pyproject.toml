[project]
name = "call_me_maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic",
    "numpy",
    "accelerate",
    "moulinette"
]

[tool.uv.workspace]
members = [
    "src/llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
moulinette = { path = "./moulinette" }

[tool.mypy]
exclude = [
    '^\\.venv/',
    '^src/llm_sdk/',
    '^moulinette/',
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]
